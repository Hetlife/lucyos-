<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111815"><meta property="og:title" content="{{OG_TITLE}}"><meta property="og:description" content="{{OG_DESCRIPTION}}"><meta property="og:type" content="website"><meta property="og:image" content="{{OG_IMAGE}}"><meta property="og:image:type" content="image/png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><title>{{OG_TITLE}}</title><link rel="stylesheet" href="/taskcheck-assets/styles.css"><script src="/taskcheck-assets/app.js" defer></script></head>
<body><main><header><span class="brand">LUCY TaskCheck</span><span id="progressText">Loading…</span></header><p id="deadline" class="muted"></p><div class="progress"><div id="bar"></div></div>
<section id="loading" class="card"><h1>Opening checklist…</h1></section>
<section id="check" class="card" hidden><button id="back" class="back" type="button">← Back</button><p id="counter" class="eyebrow"></p><h1 id="title"></h1><p id="instruction" class="instruction"></p><details><summary>Help</summary><p id="help"></p><p><strong>Expected:</strong> <span id="expected"></span></p></details><div class="choices"><button data-answer="PASS" class="pass">PASS</button><button data-answer="FAIL" class="fail">FAIL</button><button data-answer="SKIP" class="skip">SKIP</button></div><label for="note">Note <span>(optional)</span></label><textarea id="note" rows="3" maxlength="1000" placeholder="Only add detail if useful"></textarea><label id="photoLabel" class="photo">Add photo/evidence<input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" capture="environment"></label><p id="evidenceState" class="muted"></p></section>
<section id="review" class="card" hidden><h1>Review before submitting</h1><p>Check your answers. You can go back and change anything before submitting.</p><div id="summary"></div><button id="edit" class="secondary">Review checks</button><button id="submit" class="primary">Submit checklist</button></section>
<section id="done" class="card" hidden><h1>Submitted</h1><p>Your checklist is saved in LUCY OS.</p><p id="doneStatus" class="status"></p><button id="download" class="secondary">Download report</button><button id="share" class="primary">Share report</button><p id="shareHelp" class="muted">On iPhone, Share opens the native share sheet so you can send the report by WhatsApp.</p></section><p id="error" class="error"></p></main></body></html>
