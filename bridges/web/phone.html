<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AION">
<meta name="theme-color" content="#0a0f0d">
<title>AION</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f6; --card: #ffffff; --border: #e2e5e2; --text: #121815; --muted: #5c6862;
    --accent: #0f7a53; --accent-text: #ffffff; --danger: #b3261e; --danger-text: #ffffff;
    --warn: #8a5a00; --warn-bg: #fff3d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0f0d; --card: #131a17; --border: #24302a; --text: #eef3ef; --muted: #93a39a;
      --accent: #33c98a; --accent-text: #052015; --danger: #ff6b60; --danger-text: #2a0605;
      --warn: #ffcf6b; --warn-bg: #2a2208;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior-y: contain; }
  body { padding-bottom: 96px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 12px 14px calc(14px + env(safe-area-inset-bottom)); }
  header.top { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(10px + env(safe-area-inset-top)) 14px 8px; display: flex;
    align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  header.top h1 { font-size: 17px; margin: 0; letter-spacing: 0.02em; }
  header.top .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  header.top .status-dot.ok { background: var(--accent); }
  header.top .status-dot.bad { background: var(--danger); }
  .asof { font-size: 11px; color: var(--muted); }
  section { margin: 16px 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
    margin: 0 0 8px 2px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 10px; }
  .money-hero { text-align: center; padding: 20px 14px; }
  .money-hero .net { font-size: 40px; font-weight: 700; line-height: 1.1; }
  .money-hero .net.neg { color: var(--danger); }
  .money-hero .net.pos { color: var(--accent); }
  .money-hero .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .money-row { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; }
  .money-row .label { color: var(--muted); }
  .proj-row { display: flex; justify-content: space-between; align-items: baseline;
    padding: 8px 0; border-top: 1px solid var(--border); }
  .proj-row:first-child { border-top: none; }
  .proj-row .name { font-weight: 600; font-size: 14px; }
  .proj-row .net { font-size: 14px; }
  .forecast-note { font-size: 12px; color: var(--muted); margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed var(--border); }
  .feed-item { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); }
  .feed-item:first-child { border-top: none; }
  .feed-item .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex: none; }
  .feed-item .dot.done { background: var(--accent); }
  .feed-item .dot.money { background: #2e8bff; }
  .feed-item .dot.failure { background: var(--danger); }
  .feed-item .dot.decision { background: var(--muted); }
  .feed-item .body { flex: 1; min-width: 0; }
  .feed-item .title { font-size: 14px; font-weight: 600; }
  .feed-item .detail { font-size: 12.5px; color: var(--muted); margin-top: 2px;
    overflow-wrap: anywhere; }
  .empty { color: var(--muted); font-size: 13.5px; padding: 6px 2px; }
  .approval-card .action { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .approval-card dl { margin: 8px 0; font-size: 13px; }
  .approval-card dt { color: var(--muted); margin-top: 6px; }
  .approval-card dd { margin: 0; }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  button { font: inherit; border: none; border-radius: 12px; padding: 13px 16px;
    font-weight: 700; font-size: 15px; cursor: pointer; flex: 1; min-height: 48px; }
  .btn-approve { background: var(--accent); color: var(--accent-text); }
  .btn-deny { background: var(--danger); color: var(--danger-text); }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .task-row { display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; gap: 10px; }
  .task-row:first-child { border-top: none; }
  .task-row .t { flex: 1; min-width: 0; }
  .task-row .t .title { font-weight: 600; }
  .task-row .t .next { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .fab { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 50%; background: var(--accent);
    color: var(--accent-text); font-size: 30px; line-height: 58px; text-align: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.28); z-index: 20; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 30;
    display: flex; align-items: flex-end; }
  .modal { background: var(--card); width: 100%; border-radius: 18px 18px 0 0; padding: 18px;
    padding-bottom: calc(18px + env(safe-area-inset-bottom)); max-height: 82vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 12px; font-size: 17px; }
  .kind-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .kind-chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
    font-size: 13px; background: var(--bg); color: var(--text); }
  .kind-chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  textarea, input[type=text] { width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px; font: inherit;
    font-size: 15px; resize: vertical; }
  .gate { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex;
    align-items: center; justify-content: center; padding: 24px; }
  .gate-box { width: 100%; max-width: 380px; }
  .gate-box h1 { font-size: 22px; margin-bottom: 6px; }
  .gate-box p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .toast { position: fixed; left: 14px; right: 14px; bottom: calc(90px + env(safe-area-inset-bottom));
    background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 12px;
    font-size: 13.5px; z-index: 40; text-align: center; }
  .warn-banner { background: var(--warn-bg); color: var(--warn); border-radius: 12px;
    padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 13px;
    padding: 6px 0; text-align: left; }
  .hidden { display: none !important; }
  a.settings { color: var(--muted); font-size: 20px; text-decoration: none; }
</style>
</head>
<body>

<div id="gate" class="gate hidden">
  <div class="gate-box">
    <h1>AION</h1>
    <p>Connect to your PC. The address and token are entered once and stay on this device only.</p>
    <label style="font-size:13px;color:var(--muted)">PC address (e.g. http://100.x.x.x:8765 over your tunnel)</label>
    <input type="text" id="gateBase" placeholder="http://127.0.0.1:8765" style="margin:6px 0 14px">
    <label style="font-size:13px;color:var(--muted)">Phone API token</label>
    <input type="text" id="gateToken" placeholder="paste token" style="margin:6px 0 16px">
    <button class="btn-approve" style="width:100%" onclick="AION.saveGate()">Connect</button>
  </div>
</div>

<div id="app" class="hidden">
<header class="top">
  <div style="display:flex;align-items:center;gap:8px">
    <span id="statusDot" class="status-dot"></span>
    <h1>AION</h1>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="asof" id="asOf"></span>
    <a href="#" class="settings" onclick="AION.forgetDevice(event)" title="Forget this device">&#8942;</a>
  </div>
</header>

<div class="wrap">
  <div id="offlineBanner" class="warn-banner hidden">Showing last known state — PC unreachable.</div>

  <section>
    <div class="card money-hero">
      <div class="sub">Real net</div>
      <div class="net" id="netFigure">₹0</div>
      <div class="sub" id="netSub">revenue − cost, ACTUAL only</div>
    </div>
    <div class="card" id="moneyDetail"></div>
    <div id="projectList"></div>
  </section>

  <section id="needsYouSection">
    <h2>Needs you</h2>
    <div id="needsYouList"></div>
  </section>

  <section>
    <h2>What changed</h2>
    <div class="card"><div id="feedList"></div></div>
  </section>

  <section>
    <h2>Top tasks</h2>
    <div class="card"><div id="taskList"></div></div>
  </section>
</div>
</div>

<div class="fab" id="fab" onclick="AION.openCapture()">+</div>

<div id="captureModal" class="modal-backdrop hidden" onclick="if(event.target===this)AION.closeCapture()">
  <div class="modal">
    <h3>Add something</h3>
    <div class="kind-row" id="kindRow">
      <div class="kind-chip active" data-kind="idea">Idea</div>
      <div class="kind-chip" data-kind="company">Company</div>
      <div class="kind-chip" data-kind="project">Project</div>
      <div class="kind-chip" data-kind="note">Note</div>
    </div>
    <textarea id="captureText" rows="3" placeholder="A few words is enough"></textarea>
    <div class="btn-row">
      <button class="btn-secondary" onclick="AION.closeCapture()">Cancel</button>
      <button class="btn-approve" onclick="AION.submitCapture()">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(function(){
  "use strict";

  var LS_BASE = "aion.base", LS_TOKEN = "aion.token", LS_CACHE = "aion.cache",
      LS_QUEUE = "aion.queue", LS_AS_OF = "aion.cache.asof";
  var state = { data: null, pendingConfirm: null };

  function ls(key, val) {
    try {
      if (val === undefined) return localStorage.getItem(key);
      if (val === null) { localStorage.removeItem(key); return; }
      localStorage.setItem(key, val);
    } catch (e) { /* private mode or blocked storage: degrade quietly */ }
  }

  function base() { return (ls(LS_BASE) || "").replace(/\/+$/, ""); }
  function token() { return ls(LS_TOKEN) || ""; }

  function fmtInr(n) {
    n = Number(n) || 0;
    var neg = n < 0; n = Math.abs(n);
    var s = n.toLocaleString("en-IN", { maximumFractionDigits: 0 });
    return (neg ? "-₹" : "₹") + s;
  }

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.remove("hidden");
    setTimeout(function(){ t.classList.add("hidden"); }, 2600);
  }

  function api(path, opts) {
    opts = opts || {};
    var url = base() + path;
    var headers = { "Authorization": "Bearer " + token() };
    if (opts.body) headers["Content-Type"] = "application/json";
    return fetch(url, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    }).then(function(r) {
      if (!r.ok) return r.json().catch(function(){ return {}; }).then(function(e){
        throw new Error(e.error || ("HTTP " + r.status));
      });
      return r.json();
    });
  }

  function showGate() {
    document.getElementById("gate").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
    document.getElementById("fab").classList.add("hidden");
    document.getElementById("gateBase").value = ls(LS_BASE) || "";
  }

  function showApp() {
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("fab").classList.remove("hidden");
  }

  function saveGate() {
    var b = document.getElementById("gateBase").value.trim();
    var t = document.getElementById("gateToken").value.trim();
    if (!b || !t) { toast("Both fields are required."); return; }
    ls(LS_BASE, b); ls(LS_TOKEN, t);
    showApp();
    refresh();
  }

  function forgetDevice(ev) {
    if (ev) ev.preventDefault();
    if (!confirm("Forget this device? You will need the token again to reconnect.")) return;
    ls(LS_BASE, null); ls(LS_TOKEN, null); ls(LS_CACHE, null); ls(LS_AS_OF, null);
    showGate();
  }

  function setStatusDot(ok) {
    var d = document.getElementById("statusDot");
    d.className = "status-dot " + (ok === true ? "ok" : ok === false ? "bad" : "");
  }

  function render(data, fromCache) {
    state.data = data;
    var money = data.money || {};
    var net = money.real_net_inr || 0;
    var netEl = document.getElementById("netFigure");
    netEl.textContent = fmtInr(net);
    netEl.className = "net " + (net > 0 ? "pos" : net < 0 ? "neg" : "");
    var pct = money.real_net_inr > 0 ? (100 * net / (data.mission_target_inr || 100000)).toFixed(2) : "0.00";
    document.getElementById("netSub").textContent =
      "revenue " + fmtInr(money.real_revenue_inr) + " · cost " + fmtInr(money.real_cost_inr) +
      " · " + pct + "% of ₹1,00,000/mo goal";

    var detail = document.getElementById("moneyDetail");
    var trend = money.trend_7d || {};
    var trendTxt = trend.change > 0 ? ("+" + fmtInr(trend.change) + " vs prior 7d")
                 : trend.change < 0 ? (fmtInr(trend.change) + " vs prior 7d") : "flat vs prior 7d";
    var html = '<div class="money-row"><span class="label">Reserve</span><span>' + fmtInr(money.reserve_inr) + '</span></div>' +
               '<div class="money-row"><span class="label">7-day trend</span><span>' + trendTxt + '</span></div>';
    if (money.non_actual && Object.keys(money.non_actual).length) {
      html += '<div class="forecast-note">Not real money — kept separate: ';
      var parts = [];
      for (var stage in money.non_actual) {
        var kv = money.non_actual[stage];
        for (var k in kv) parts.push(stage + " " + k + " " + fmtInr(kv[k]));
      }
      html += parts.join(", ") + '</div>';
    }
    detail.innerHTML = html;

    var projEl = document.getElementById("projectList");
    if (money.by_project && money.by_project.length) {
      projEl.innerHTML = '<div class="card">' + money.by_project.map(function(p) {
        return '<div class="proj-row"><span class="name">' + escapeHtml(p.project) +
               '</span><span class="net ' + (p.net > 0 ? "pos" : p.net < 0 ? "neg" : "") + '">' +
               fmtInr(p.net) + '</span></div>';
      }).join("") + '</div>';
    } else {
      projEl.innerHTML = "";
    }

    var needsYou = data.needs_you || { approvals: [], blocked_tasks: [], feedback_needed: [] };
    var nySection = document.getElementById("needsYouSection");
    var nyList = document.getElementById("needsYouList");
    var cards = [];
    (needsYou.approvals || []).forEach(function(a) { cards.push(approvalCardHtml(a)); });
    (needsYou.feedback_needed || []).forEach(function(t) { cards.push(feedbackCardHtml(t)); });
    (needsYou.blocked_tasks || []).forEach(function(t) {
      cards.push('<div class="card"><div class="approval-card"><div class="action">' +
        escapeHtml(t.title) + '</div><dl><dt>Blocked</dt><dd>' + escapeHtml(t.reason) +
        '</dd></dl></div></div>');
    });
    if (cards.length === 0) {
      nySection.classList.add("hidden");
    } else {
      nySection.classList.remove("hidden");
      nyList.innerHTML = cards.join("");
    }

    var feed = data.feed || [];
    document.getElementById("feedList").innerHTML = feed.length ? feed.map(function(i) {
      return '<div class="feed-item"><span class="dot ' + escapeAttr(i.type) + '"></span>' +
        '<div class="body"><div class="title">' + escapeHtml(i.title) + '</div>' +
        (i.detail ? '<div class="detail">' + escapeHtml(i.detail) + '</div>' : '') + '</div></div>';
    }).join("") : '<div class="empty">Nothing yet.</div>';

    var asOfLabel = fromCache ? ("as of " + relTime(data.as_of || ls(LS_AS_OF))) : "live";
    document.getElementById("asOf").textContent = asOfLabel;
    document.getElementById("offlineBanner").classList.toggle("hidden", !fromCache);
    setStatusDot(!fromCache);
  }

  function relTime(iso) {
    if (!iso) return "unknown";
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    var s = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";
  }

  function approvalCardHtml(a) {
    return '<div class="card approval-card">' +
      '<div class="action">' + escapeHtml(a.action) + '</div>' +
      '<dl>' +
      '<dt>Why</dt><dd>' + escapeHtml(a.why || "not recorded") + '</dd>' +
      '<dt>Cost</dt><dd>' + escapeHtml(a.cost || "none") + '</dd>' +
      '<dt>Max downside</dt><dd>' + escapeHtml(a.max_downside || "not recorded") + '</dd>' +
      '<dt>Reversibility</dt><dd>' + escapeHtml(a.reversibility || "unknown") + '</dd>' +
      '</dl>' +
      '<div class="btn-row">' +
      '<button class="btn-deny" onclick="AION.confirmApproval(\\'' + a.approval_id + '\\',\\'DENY\\')">Deny</button>' +
      '<button class="btn-approve" onclick="AION.confirmApproval(\\'' + a.approval_id + '\\',\\'APPROVE\\')">Approve</button>' +
      '</div></div>';
  }

  function feedbackCardHtml(t) {
    return '<div class="card approval-card">' +
      '<div class="action">' + escapeHtml(t.title) + '</div>' +
      (t.why ? '<dl><dt>Context</dt><dd>' + escapeHtml(t.why) + '</dd></dl>' : '') +
      '<div class="btn-row">' +
      '<button class="btn-deny" onclick="AION.sendFeedback(\\'' + t.task_id + '\\',\\'no\\')">No</button>' +
      '<button class="btn-secondary" onclick="AION.sendFeedback(\\'' + t.task_id + '\\',\\'later\\')">Later</button>' +
      '<button class="btn-approve" onclick="AION.sendFeedback(\\'' + t.task_id + '\\',\\'yes\\')">Yes</button>' +
      '</div></div>';
  }

  function confirmApproval(id, verb) {
    var label = verb === "APPROVE" ? "Approve" : "Deny";
    if (!confirm(label + " " + id + "? This sends the real command.")) return;
    api("/api/command", { method: "POST", body: { message: verb + " " + id } })
      .then(function(res) { toast(res.reply ? res.reply.split("\\n")[0] : (label + "d.")); refresh(); })
      .catch(function(e) { toast("Failed: " + e.message); });
  }

  function sendFeedback(taskId, choice) {
    api("/api/feedback", { method: "POST", body: { task_id: taskId, choice: choice } })
      .then(function(res) { toast(res.message || "Recorded."); refresh(); })
      .catch(function(e) { toast("Failed: " + e.message); });
  }

  function renderTasks() {
    api("/api/tasks").then(function(res) {
      var list = res.tasks || [];
      document.getElementById("taskList").innerHTML = list.length ? list.slice(0, 8).map(function(t) {
        return '<div class="task-row"><div class="t"><div class="title">' + escapeHtml(t.title) +
          '</div>' + (t.next_action ? '<div class="next">' + escapeHtml(t.next_action) + '</div>' : '') +
          '</div></div>';
      }).join("") : '<div class="empty">Queue is empty.</div>';
    }).catch(function() { /* dashboard call already surfaced the offline state */ });
  }

  function refresh() {
    if (!base() || !token()) { showGate(); return; }
    api("/api/dashboard").then(function(data) {
      ls(LS_CACHE, JSON.stringify(data));
      ls(LS_AS_OF, data.as_of);
      render(data, false);
      renderTasks();
      flushQueue();
    }).catch(function() {
      var cached = ls(LS_CACHE);
      if (cached) { render(JSON.parse(cached), true); }
      else { setStatusDot(false); document.getElementById("asOf").textContent = "unreachable"; }
    });
  }

  function openCapture() {
    document.getElementById("captureModal").classList.remove("hidden");
    document.getElementById("captureText").focus();
  }
  function closeCapture() {
    document.getElementById("captureModal").classList.add("hidden");
    document.getElementById("captureText").value = "";
  }
  function submitCapture() {
    var text = document.getElementById("captureText").value.trim();
    if (!text) return;
    var kind = document.querySelector(".kind-chip.active").getAttribute("data-kind");
    var item = { text: text, kind: kind, ts: Date.now() };
    closeCapture();
    if (!navigator.onLine) { queueCapture(item); toast("Saved offline — will send when reachable."); return; }
    api("/api/capture", { method: "POST", body: { text: item.text, kind: item.kind } })
      .then(function(res) { toast(res.message || "Saved."); refresh(); })
      .catch(function() { queueCapture(item); toast("Saved offline — will send when reachable."); });
  }
  function queueCapture(item) {
    var q = JSON.parse(ls(LS_QUEUE) || "[]");
    q.push(item);
    ls(LS_QUEUE, JSON.stringify(q));
  }
  function flushQueue() {
    var q = JSON.parse(ls(LS_QUEUE) || "[]");
    if (!q.length) return;
    var remaining = [];
    var chain = Promise.resolve();
    q.forEach(function(item) {
      chain = chain.then(function() {
        return api("/api/capture", { method: "POST", body: { text: item.text, kind: item.kind } })
          .catch(function() { remaining.push(item); });
      });
    });
    chain.then(function() {
      ls(LS_QUEUE, JSON.stringify(remaining));
      if (remaining.length !== q.length) toast("Synced queued items.");
    });
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function escapeAttr(s) { return String(s || "").replace(/[^a-z]/gi, ""); }

  document.addEventListener("click", function(e) {
    var chip = e.target.closest(".kind-chip");
    if (chip) {
      document.querySelectorAll(".kind-chip").forEach(function(c){ c.classList.remove("active"); });
      chip.classList.add("active");
    }
  });

  window.AION = {
    saveGate: saveGate, forgetDevice: forgetDevice, openCapture: openCapture,
    closeCapture: closeCapture, submitCapture: submitCapture,
    confirmApproval: confirmApproval, sendFeedback: sendFeedback,
  };

  if (!base() || !token()) { showGate(); } else { showApp(); refresh(); }
  setInterval(function() { if (base() && token()) refresh(); }, 30000);
  window.addEventListener("online", flushQueue);
})();
</script>
</body>
</html>
