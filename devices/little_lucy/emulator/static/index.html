<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Lucy</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171717;color:white;font:20px system-ui;display:grid;place-items:center;min-height:100vh}.screen{width:480px;height:272px;background:#000;position:relative;overflow:hidden;border:1px solid #333}.character{position:absolute;left:34px;top:45px;width:150px;height:152px;border:7px solid white;border-radius:48% 48% 42% 42%;display:grid;place-items:center;font-size:62px;color:white}.message{position:absolute;left:214px;top:48px;right:22px}.state{color:#f33;font-size:20px;font-weight:800;letter-spacing:.06em}.status{font-size:28px;font-weight:700;line-height:1.15;margin-top:15px;overflow-wrap:anywhere}.touch{position:absolute;left:16px;right:16px;bottom:12px;height:56px;border:2px solid white;border-radius:14px;background:#000;color:white;font-size:24px;font-weight:bold;touch-action:manipulation}.touch:active{background:#222}
</style><div class="screen"><canvas id="proof" width="480" height="272" style="display:none;position:absolute;inset:0;z-index:5"></canvas><div class="character" aria-label="Lucy character">●ᴗ●</div><div class="message"><div class="state" id="state">OFFLINE</div><div class="status" id="status">Connecting</div></div><button class="touch" id="touch">WAKE LUCY</button></div>
<script>
if(new URLSearchParams(location.search).has("proof")){fetch("/proof.raw").then(r=>r.arrayBuffer()).then(b=>{const raw=new Uint8Array(b),c=document.getElementById("proof"),ctx=c.getContext("2d"),img=ctx.createImageData(480,272);for(let i=0;i<raw.length;i+=4){img.data[i]=raw[i+2];img.data[i+1]=raw[i+1];img.data[i+2]=raw[i];img.data[i+3]=255}ctx.putImageData(img,0,0);c.style.display="block"})}
let last=-1,lastSeen=0;const state=document.getElementById('state'),status=document.getElementById('status');
async function poll(){try{const r=await fetch('/state',{cache:'no-store'});if(!r.ok)throw Error();const x=await r.json();if(x.version!==1||typeof x.sequence!=='number'||typeof x.timestamp!=='number'||typeof x.status!=='string'||x.status.length>48||Math.abs(Date.now()/1000-x.timestamp)>15||x.sequence<last)throw Error();last=x.sequence;lastSeen=Date.now();state.textContent=x.state;status.textContent=x.status}catch{if(Date.now()-lastSeen>15000){state.textContent='OFFLINE';status.textContent='Connection lost'}else{state.textContent='RECONNECTING';status.textContent='Reconnecting'}}}
setInterval(poll,1000);poll();document.getElementById('touch').onclick=()=>{status.textContent='Touch input awaiting host adapter'};
</script></html>
